name: Validate Build

on:
  push:
    branches: [master, main, feature/*]
  pull_request:

jobs:
  validate-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build desktop app
        run: ./gradlew.bat :composeApp:desktopJar --console=plain

      - name: Run desktop tests
        run: ./gradlew.bat :composeApp:desktopTest --console=plain

  validate-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android app (standalone project in DeX/)
        working-directory: DeX
        run: ./gradlew :app:assembleDebug --console=plain
