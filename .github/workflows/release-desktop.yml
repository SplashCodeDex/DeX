name: Release Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Build DMG
        run: |
          cd DeX
          ./gradlew :composeApp:packageDmg
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeX-macOS
          path: DeX/composeApp/build/compose/binaries/main/dmg/*.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Build MSI
        run: |
          cd DeX
          ./gradlew :composeApp:packageMsi
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeX-Windows
          path: DeX/composeApp/build/compose/binaries/main/msi/*.msi
